[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvcs"
version = "0.2.0"
description = "A small, educational, local-first version control system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PyVCS contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
pyvcs = "pyvcs.cli:main"

[tool.setuptools.packages.find]
include = ["pyvcs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
